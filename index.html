:root{--bg:#f7efe4;--bg2:#fbf6ee;--card:#fffdf9;--tx:#3a2a22;--mu:#8a7767;--ac:#9a6240;--ac2:#c58d62;--acx:#fff;--bd:#ead9c6;--rd:#b8402f;--bn:#5a3523;--hd:rgba(247,239,228,.9);--sh:0 6px 22px rgba(90,53,35,.10);--cg:linear-gradient(135deg,#b97a4a,#8a5434 55%,#63402b);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--bg2:#241a15;--card:#2b201a;--tx:#f3e8dc;--mu:#b5a291;--ac:#d9a074;--ac2:#e8bd96;--acx:#2a1a10;--bd:#42332a;--rd:#ff8a77;--bn:#e8bd96;--hd:rgba(28,20,16,.9);--sh:0 6px 22px rgba(0,0,0,.35);--cg:linear-gradient(135deg,#ebc29b,#d09564 55%,#b27a4d);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1410;--bg2:#241a15;--card:#2b201a;--tx:#f3e8dc;--mu:#b5a291;--ac:#d9a074;--ac2:#e8bd96;--acx:#2a1a10;--bd:#42332a;--rd:#ff8a77;--bn:#e8bd96;--hd:rgba(28,20,16,.9);--sh:0 6px 22px rgba(0,0,0,.35);--cg:linear-gradient(135deg,#ebc29b,#d09564 55%,#b27a4d);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 8% -5%,rgba(217,164,119,.28),transparent 65%),radial-gradient(800px 400px at 100% 30%,rgba(197,141,98,.14),transparent 60%),var(--bg);color:var(--tx);font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5}
h1{font-size:1.25rem;margin:0}
.btn{background:var(--cg);color:var(--acx);border:0;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;font-weight:600;letter-spacing:.02em;box-shadow:0 3px 10px rgba(90,53,35,.18);transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.o{background:none;color:var(--ac);border:1.5px solid var(--ac);box-shadow:none}.btn.w{width:100%;margin-top:8px}.btn.r{background:none;color:var(--rd);border:1.5px solid var(--rd);padding:5px 12px;box-shadow:none}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.bw{max-width:1100px;margin:18px auto 0;padding:0 18px}

const col=id=>{const q=PAL[[...id].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%PAL.length];return`repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(60,35,20,.06) 0 2px,transparent 2px 9px),linear-gradient(135deg,${q[0]},${q[1]})`};

if(tab=="s"){const s=S.set;b=`<label>Назва магазину<input data-s="name" value="${esc(s.name)}"></label><label>Підзаголовок<input data-s="tag" value="${esc(s.tag)}"></label><label>Телефон (цифри, напр. 380671234567)<input data-s="phone" value="${esc(s.phone)}"></label><label>Графік роботи<input data-s="hours" value="${esc(s.hours)}"></label><label>Email<input data-s="email" value="${esc(s.email)}"></label><label>Посилання на карту<input data-s="map" value="${esc(s.map)}"></label>`}
else if(ed){b=`<label>Назва<input data-e="n" value="${esc(ed.n)}"></label><label>Категорія<input data-e="c" list="cl" value="${esc(ed.c)}" placeholder="напр. Постіль"></label><label>Ціна, ₴<input data-e="pr" type="number" min="0" value="${esc(ed.pr)}"></label><label>Стара ціна (для знижки, необов’язково)<input data-e="old" type="number" min="0" value="${esc(ed.old)}"></label><label>Опис<textarea data-e="d" rows="3">${esc(ed.d)}</textarea></label><label>Фото<input type="file" accept="image/*" data-img></label>${ed.img?`<img class="sw" style="margin-top:8px;border-radius:8px" src="${ed.img}"><button class="btn r" data-rimg style="margin-top:6px">Прибрати фото</button>`:""}<label><input type="checkbox" data-e="on" ${ed.on?"checked":""}>В наявності</label><button class="btn w" data-esave>Зберегти товар</button><button class="btn o w" data-ecancel>Скасувати</button>`}
else b=`<button class="btn w" data-new style="margin:0 0 8px">+ Додати товар</button>`+(S.p.length?S.p.map(p=>`<div class="row"><span style="display:flex;gap:10px;align-items:center">${p.img?`<img class="th" src="${p.img}">`:`<span class="th" style="background:${col(p.id)}"></span>`}<span>${esc(p.n)}<br><small>${fmt(p.pr)} · ${esc(p.c)} ${p.on?"":'<span class="tag">· немає</span>'}</small></span></span><span><button class="btn o" style="padding:5px 10px" data-ed="${p.id}">Ред.</button> <button class="btn r" data-del="${p.id}">✕</button></span></div>`).join(""):"<p>Товарів немає. Додайте перший.</p>");
return`<div class="ad"><div class="w">${head}${b}${dl}</div></div>`}

function readImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.8))};i.onerror=no;i.src=u})}

async function exportSite(){
const c=document.documentElement.cloneNode(true);c.querySelector("#app").innerHTML="";
c.querySelector("#data").textContent=JSON.stringify(Object.assign({},S,{v:Date.now()})).replace(/</g,"\\u003c");
const html="<!DOCTYPE html>\n"+c.outerHTML;
let dl=null;try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){}
if(dl){try{await dl.save({filename:"index.html",data:html})}catch(e){if(!e||e.code!="declined")alert("Не вдалося зберегти файл")}return}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="index.html";document.body.appendChild(a);a.click();a.remove()}

function send(){
const v=i=>$(i).value.trim();
if(!v("f1")||!v("f2")||!v("f3")){alert("Заповніть ім’я, телефон і місто");return}
window._t="Нове замовлення\n"+Object.keys(cart).map(i=>`• ${find(i).n} × ${cart[i]}`).join("\n")+`\nРазом: ${fmt(total())}\n${v("f1")}, ${v("f2")}, ${v("f3")}\n${$("f4").value}; ${$("f5").value}\n${v("f6")}`;
cart={};save();dv="done";render()}

document.addEventListener("click",async e=>{
const t=e.target.closest("[data-c],[data-a],[data-p],[data-m],[data-go],[data-back],[data-send],[data-viber],[data-oc],[data-cl],[data-ao],[data-ac],[data-pub],[data-t],[data-new],[data-ed],[data-del],[data-esave],[data-ecancel],[data-rimg],[data-reset]");if(!t)return;
const d=t.dataset;
if(d.c!==undefined)cat=d.c;
if(d.a!==undefined){cart[d.a]=(cart[d.a]||0)+1;save();dv="cart"}
if(d.p!==undefined){cart[d.p]++;save()}
if(d.m!==undefined){if(--cart[d.m]<=0)delete cart[d.m];save()}
if("go" in d)dv="form";if("back" in d)dv="cart";if("oc" in d)dv="cart";if("cl" in d)dv=null;
if("send" in d)return send();
if("viber" in d){try{navigator.clipboard.writeText(window._t)}catch(x){}location.href=viber();return}
if("ao" in d)ao=true;if("ac" in d){ao=false;ed=null}
if("pub" in d)return exportSite();
if("reset" in d){if(confirm("Скасувати всі незавантажені зміни?")){try{localStorage.removeItem("satyn_draft")}catch(x){}location.reload()}return}
if(d.t){tab=d.t;ed=null}
if("new" in d)ed={id:"p"+Date.now().toString(36),n:"",c:"",pr:"",old:"",d:"",img:"",on:true,_new:1};
if(d.ed){ed=JSON.parse(JSON.stringify(find(d.ed)))}
if(d.del&&confirm("Видалити цей товар?")){S.p=S.p.filter(x=>x.id!=d.del);delete cart[d.del];persist()}
if("ecancel" in d)ed=null;
if("rimg" in d)ed.img="";
if("esave" in d){if(!ed.n.trim()||!(Number(ed.pr)>0)){alert("Вкажіть назву та ціну");return}
const o={id:ed.id,n:ed.n.trim(),c:(ed.c||"Інше").trim(),pr:Number(ed.pr),old:Number(ed.old)>Number(ed.pr)?Number(ed.old):0,d:ed.d,img:ed.img,on:!!ed.on},i=S.p.findIndex(x=>x.id==ed.id);
i<0?S.p.unshift(o):S.p[i]=o;ed=null;persist()}
render()});
document.addEventListener("input",e=>{const d=e.target.dataset;
if(d.e){ed[d.e]=e.target.type=="checkbox"?e.target.checked:e.target.value}
if(d.s){S.set[d.s]=e.target.value;persist()}});
document.addEventListener("change",async e=>{
if(e.target.dataset.img!==undefined&&e.target.files[0]){try{ed.img=await readImg(e.target.files[0]);render()}catch(x){alert("Не вдалося прочитати фото")}}
if(e.target.dataset.s){render()}});
render();
addEventListener("hashchange",()=>{adm=location.hash=="#admin";ao=adm;render()});
</script>


</body></html>
